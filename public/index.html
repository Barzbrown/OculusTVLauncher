<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Construct</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1rem;
      color: #222;
      pointer-events: none;
      mix-blend-mode: difference;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="overlay">Nova Construct – enter VR to begin.</div>
  <input type="file" id="fileInput" style="display:none" />
  <input type="file" id="avatarInput" accept="image/*" style="display:none" />
  <script type="module" src="../src/main.js"></script>
</body>
</html>
